name: Fix mobile search engine selector

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-search-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reliable touch handling for iPhone
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/search.js')
          s = p.read_text(encoding='utf-8')
          old = '''  engineBtn?.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    toggleEngineMenu();
  });

  engineOptions.forEach((button) => {
    button.addEventListener("click", (event) => {
      event.preventDefault();
      const id = button.dataset.engine;
      setDefaultEngineId(id);
      closeEngineMenu({ focusButton: true });
      searchInput?.focus();
    });
  });'''
          new = '''  let lastTouchEngineActionAt = 0;

  engineBtn?.addEventListener("pointerup", (event) => {
    if (event.pointerType !== "touch") return;
    event.preventDefault();
    event.stopPropagation();
    lastTouchEngineActionAt = Date.now();
    toggleEngineMenu();
  });

  engineBtn?.addEventListener("click", (event) => {
    if (Date.now() - lastTouchEngineActionAt < 500) return;
    event.preventDefault();
    event.stopPropagation();
    toggleEngineMenu();
  });

  engineOptions.forEach((button) => {
    button.addEventListener("pointerup", (event) => {
      if (event.pointerType !== "touch") return;
      event.preventDefault();
      event.stopPropagation();
      lastTouchEngineActionAt = Date.now();
      const id = button.dataset.engine;
      setDefaultEngineId(id);
      closeEngineMenu();
      keepSpotlightFocused();
    });

    button.addEventListener("click", (event) => {
      if (Date.now() - lastTouchEngineActionAt < 500) return;
      event.preventDefault();
      const id = button.dataset.engine;
      setDefaultEngineId(id);
      closeEngineMenu({ focusButton: true });
      searchInput?.focus();
    });
  });'''
          if old not in s:
              raise SystemExit('Target block not found; no change made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/search.js
          git commit -m "Fix mobile search engine selector"
          git push
