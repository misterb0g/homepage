<head>

  <title>Start Desk</title>

  <script>
    (function () {
      try {
        var root = document.documentElement;
        var pref = localStorage.getItem('theme') || 'system';
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var effective;

        if (pref === 'system') {
          effective = mq.matches ? 'dark' : 'light';
        } else if (pref === 'mac') {
          effective = mq.matches ? 'macos-dark' : 'macos-light';
        } else {
          effective = pref;
        }

        root.setAttribute('data-theme', effective);
        root.setAttribute('data-theme-pref', pref);
        root.style.colorScheme = effective.indexOf('dark') !== -1 ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="application-name" content="Start Desk">
  <meta name="apple-mobile-web-app-title" content="Start Desk">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">


  <script>
    /* Migration desktop exécutée une seule fois.
       Elle active Focus pour les navigateurs existants, puis les choix ultérieurs
       de l'utilisateur restent prioritaires. Le comportement mobile est inchangé. */
    (function () {
      try {
        var focusKey = 'startpage_focus_mode_v1';
        var migrationKey = 'startdesk_desktop_focus_default_v1';
        var isDesktop = window.matchMedia(
          '(min-width: 769px) and (hover: hover) and (pointer: fine)'
        ).matches;
        var savedFocus = localStorage.getItem(focusKey);

        if (isDesktop && localStorage.getItem(migrationKey) !== '1') {
          localStorage.setItem(focusKey, '1');
          localStorage.setItem(migrationKey, '1');
          savedFocus = '1';
        }

        if (savedFocus === '1' || (savedFocus === null && isDesktop)) {
          document.documentElement.classList.add('focus-default');
        }

        document.documentElement.classList.add('start-desk');
      } catch (e) {}
    })();
  </script>
